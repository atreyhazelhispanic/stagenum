name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stagenum_test
          POSTGRES_USER: stagenum
          POSTGRES_PASSWORD: stagenum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stagenum -d stagenum_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      APP_ENV: test
      PROCESS_ROLE: web
      DATABASE_URL: postgresql://stagenum:stagenum@localhost:5432/stagenum_test
      LOG_LEVEL: silent
      RELEASE_SHA: ${{ github.sha }}
      MIGRATIONS_DIR: db/migrations

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify schema
        run: npm run db:check

      - name: Build application
        run: npm run build

      - name: Build container
        run: docker build --tag stagenum:${{ github.sha }} .

  prototype:
    name: Prototype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build prototype
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
