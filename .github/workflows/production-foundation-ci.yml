name: Production Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stagenum_test
          POSTGRES_USER: stagenum
          POSTGRES_PASSWORD: stagenum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stagenum -d stagenum_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      APP_ENV: test
      PROCESS_ROLE: web
      DATABASE_URL: postgresql://stagenum:stagenum@localhost:5432/stagenum_test
      LOG_LEVEL: silent
      RELEASE_SHA: ci
      MIGRATIONS_DIR: db/migrations

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create schema from zero
        run: npm run db:migrate

      - name: Verify schema
        run: npm run db:check

      - name: Build
        run: npm run build
